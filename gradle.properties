android.useAndroidX=true
android.suppressUnsupportedCompileSdk=36

# Knurl version for the next build. Raise knurlVersionCode for every build that
# leaves this machine, including tester builds. See docs/release-checklist.md.
# Last published release: 1.9.1 (29)
knurlVersionCode=29
knurlVersionName=1.9.1

# Names that must never appear in the shipped asset. Checked by app/build.gradle.
knurlPersonalNames=Kevin,Brandon,Damien,Holloway

# Signing identity of every shipped build. Android cannot install an update signed
# with a different key, so this must not change without a coordinated reinstall.
# Replacement signing key generated after the original key was lost in the 2026-09-16 rebuild.
# Local backup: ~/.android/knurl-signing-key-backup.keystore
knurlSigningSha256=9F:80:ED:DC:12:45:7E:AF:E4:71:11:3F:CB:E1:A1:E7:DD:66:25:02:6B:B5:01:18:73:62:21:FB:48:DD:B2:44
